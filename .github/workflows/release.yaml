name: Release
on:
  release:
    types: [ published ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Assume that input tag is formatted like 'v1.2.3' and transforms that to '1.2.3'
      - name: Normalize version
        id: normalize-version
        uses: actions/github-script@211cb3fefb35a799baa5156f9321bb774fe56294 # v5
        with:
          result-encoding: string
          script: |
            const tagName = context.payload.release.tag_name;
            if (tagName.startsWith("v")) {
                const version = tagName.substring(1);
                console.log(`Setting version to ${version}`);
                core.setOutput('version', version);
            } else {
                core.setFailed(`Release tag ${tagName} does not have a prefix 'v'`);
            }
    outputs:
      version: ${{ steps.normalize-version.outputs.version }}

  # TODO: duplication from build.yaml
  build:
    needs: [ prepare ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elasticsearchVersion: ['7.10.2', '7.13.2', '7.14.2', '7.15.2', '7.16.2', '7.16.3', '7.17.2', '7.17.6', '8.4.3']
      fail-fast: false
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
        with:
          java-version: 8
      - uses: gradle/wrapper-validation-action@56b90f209b02bf6d1deae490e9ef18b21a389cd4 # v1
      - uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2
        with:
          arguments: build -DbaseVersion=${{ needs.prepare.outputs.version }} -DelasticsearchVersion=${{ matrix.elasticsearchVersion }}
      - name: Upload the artifacts
        uses: skx/github-action-publish-binaries@b9ca5643b2f1d7371a6cba7f35333f1461bbc703 # release-2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: 'build/distributions/*.zip'
